name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDL3_VERSION: "3.4.16"
  SDL3_TTF_VERSION: "3.2.2"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: latest

      - name: Verify Odin
        run: odin version

      - name: Build Odin vendor:stb
        run: "$(odin root)/vendor/stb/src/build_stb.sh"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf cmake ninja-build \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxtst-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdrm-dev libgbm-dev

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: sdl3-prefix
          key: sdl3-linux-${{ env.SDL3_VERSION }}-ttf-${{ env.SDL3_TTF_VERSION }}

      - name: Build SDL3 and SDL3_ttf
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch "release-${SDL3_VERSION}" \
            https://github.com/libsdl-org/SDL.git \
            sdl-src

          cmake -S sdl-src -B sdl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-prefix" \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF

          cmake --build sdl-build
          cmake --install sdl-build

          git clone --depth 1 \
            --recursive \
            --shallow-submodules \
            --branch "release-${SDL3_TTF_VERSION}" \
            https://github.com/libsdl-org/SDL_ttf.git \
            sdl-ttf-src

          cmake -S sdl-ttf-src -B sdl-ttf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-prefix" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdl3-prefix" \
            -DSDLTTF_VENDORED=ON \
            -DSDLTTF_SAMPLES=OFF

          cmake --build sdl-ttf-build
          cmake --install sdl-ttf-build

      - name: Vet + test (debug)
        run: odin test tests/ -collection:bento=src -vet -strict-style -vet-tabs

      - name: Compile check (release)
        run: odin test tests/ -collection:bento=src -o:speed
